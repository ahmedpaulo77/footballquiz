name: Deploy to GitHub Pages (Actions)

# ملاحظة مهمة:
# الموقع حاليًا بينشر من «Deploy from a branch → main / (root)»،
# والنسخة المبنية بتتحط في جذر الريبو بأمر: npm run pages
#
# الـ workflow ده بيشتغل يدويًا بس، وبيستخدمه لما تحوّل
# Settings → Pages → Source إلى «GitHub Actions».
# ساعتها النشر هيبقى تلقائي مع كل push (شيل السطرين تحت وأضف push).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # تفعيل GitHub Pages تلقائيًا أول مرة
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
